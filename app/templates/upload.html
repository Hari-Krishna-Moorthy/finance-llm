<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Statements - Finance LLM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background: #212529; color: white; padding: 20px; }
        .main-content { padding: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <h4>Finance LLM</h4>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link text-white" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/upload">Upload Statements</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/transactions">Transactions</a></li>
                </ul>
            </nav>
            <main class="col-md-10 main-content">
                <h2>Upload Bank Statements</h2>
                <hr>
                <div class="card col-md-6">
                    <div class="card-body">
                        <form action="/upload" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="account_id" class="form-label">Select Account</label>
                                <select name="account_id" id="account_id" class="form-select" required>
                                    {% for account in accounts %}
                                    <option value="{{ account.id }}">{{ account.name }} ({{ account.account_type }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="file" class="form-label">Statement File (CSV, XLSX, PDF)</label>
                                <input type="file" name="file" id="file" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Upload and Process</button>
                        </form>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h5>Supported Formats</h5>
                    <ul>
                        <li>Standard CSV (Date, Description, Amount)</li>
                        <li>Excel (.xlsx)</li>
                        <li>PDF Bank Statements (Extraction via pdfplumber)</li>
                    </ul>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
