<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance LLM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #212529; color: white; padding: 20px; }
        .main-content { padding: 20px; }
        .badge-debit { background-color: #dc3545; }
        .badge-credit { background-color: #198754; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <h4>Finance LLM</h4>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link text-white" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/accounts">Manage Accounts</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/upload">Upload Statements</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/transactions">Transactions</a></li>
                </ul>
            </nav>
            <main class="col-md-10 main-content">
                {% if message %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}
                
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
